    <!-- Chaotic Movement Animation -->
    <script>
      let posX = 0,
        posY = 0;
      let velocityX = 0,
        velocityY = 0;

      function chaoticMovement() {
        const el = document.body;
        const { width: w, height: h } = el.getBoundingClientRect();

        velocityX += (Math.random() - 0.5) * 2;
        velocityY += (Math.random() - 0.5) * 2;

        velocityX *= 0.98;
        velocityY *= 0.98;

        posX += velocityX;
        posY += velocityY;

        const maxX = w / 2;
        const maxY = h / 2;

        if (Math.abs(posX) > maxX) {
          posX = Math.sign(posX) * maxX * 0.9;
          velocityX *= -0.8;
        }

        if (Math.abs(posY) > maxY) {
          posY = Math.sign(posY) * maxY * 0.9;
          velocityY *= -0.8;
        }

        document.body.style.setProperty("--posX", posX);
        document.body.style.setProperty("--posY", posY);

        requestAnimationFrame(chaoticMovement);
      }

      chaoticMovement();
    </script>
